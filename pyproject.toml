[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seglens"
version = "0.1.0"
description = "Model-agnostic causal lenses for medical image segmentation explainability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Fernando González Salas" },
]
keywords = [
    "interpretability",
    "explainability",
    "segmentation",
    "medical-imaging",
    "mri",
    "jacobian",
    "lens",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
universeg = [
    "universeg @ git+https://github.com/JJGO/UniverSeg.git",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "notebook>=7.0",
]
all = [
    "seglens[universeg,dev]",
]

[project.urls]
Homepage = "https://github.com/<user>/SegLens"
Issues = "https://github.com/<user>/SegLens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seglens = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: tests that take more than 5 seconds",
    "integration: tests requiring a GPU or external model",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
